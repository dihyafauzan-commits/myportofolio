{% if user.is_authenticated %}
    <form method="post" action="{% url 'main:toggle_star' project.id %}" class="star-form" style="display: inline-block;">
        {% csrf_token %}
        <button type="submit"
                class="button button-star{% if user in project.starred_by.all %} is-starred{% endif %}"
                style="background-color: #ffc107 !important; color: #222 !important; padding: 8px 12px; border-radius: 4px; border: none; cursor: pointer;"
                title="{% if project.starred_by.all %}Starred by {{ project.starred_by.all|join:', ' }}{% else %}Be the first to star{% endif %}">
            <span aria-hidden="true">★</span>
            {% if user in project.starred_by.all %}Unstar{% else %}Star{% endif %}
            <span class="star-count">{{ project.starred_by.count }}</span>
        </button>
    </form>

{% else %}
    <a href="{% url 'login' %}?next={{ request.path }}" 
       class="button button-star" 
       style="background-color: #e2e8f0 !important; color: #4a5568 !important; padding: 8px 12px; border-radius: 4px; text-decoration: none; display: inline-block; cursor: pointer;"
       title="{% if project.starred_by.all %}Starred by {{ project.starred_by.all|join:', ' }}{% else %}Be the first to star{% endif %}">
        <span aria-hidden="true">☆</span> Star
        <span class="star-count">{{ project.starred_by.count }}</span>
    </a>
{% endif %}
